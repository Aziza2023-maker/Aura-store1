<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة التجميع الذكية</title>
    <style>
        /* إعدادات الخطوط وتنسيق الخلفية العامة لتجربة مريحة (UX/UI) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* تصميم البطاقة (Card Design) لفصل المحتوى وإعطاء تركيز بصري */
        .calculator-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-size: 1.4rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 24px;
        }

        /* تنسيق مجموعات الإدخال لتحسين وضوح التسميات */
        .input-group {
            margin-bottom: 16px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #555;
            font-weight: 600;
        }

        /* تصميم حقول الإدخال مع تأثيرات التفاعل (Focus States) */
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccd1d1;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }

        /* تصميم زر التفاعل (Call to Action) ليكون واضحاً وجذاباً */
        button {
            width: 100%;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:active {
            transform: scale(0.98);
        }

        /* منطقة عرض النتائج مع تباين بصري واصطفاف مريح */
        #result-area {
            margin-top: 20px;
            padding: 12px;
            background-color: #e8f8f5;
            border: 1px solid #a3e4d7;
            border-radius: 6px;
            color: #0e6251;
            font-size: 0.95rem;
            text-align: center;
            min-height: 24px;
        }
    </style>
</head>

<body>

    <div class="calculator-card">
        <h2>حاسبة جمع رقمين</h2>

        <!-- الحقل الأول -->
        <div class="input-group">
            <label for="num1">الرقم الأول:</label>
            <input type="number" id="num1" placeholder="أدخل الرقم الأول هنا">
        </div>

        <!-- الحقل الثاني -->
        <div class="input-group">
            <label for="num2">الرقم الثاني:</label>
            <input type="number" id="num2" placeholder="أدخل الرقم الثاني هنا">
        </div>

        <!-- زر التفاعل -->
        <button onclick="performAddition()">احسب المجموع</button>

        <!-- منطقة عرض النتيجة -->
        <div id="result-area">النتيجة ستظهر هنا...</div>
    </div>

    <script>
        function performAddition() {
            let val1 = Number(document.getElementById('num1').value);
            let val2 = Number(document.getElementById('num2').value);

            let totalSum = val1 + val2;

            console.log("حاصل الجمع هو: " + totalSum);
            alert("حاصل الجمع هو: " + totalSum);

            document.getElementById('result-area').innerHTML =
                "نتيجة الجمع: <strong>" + val1 + " + " + val2 + " = " + totalSum + "</strong>";
        }
    </script>

</body>

</html>
